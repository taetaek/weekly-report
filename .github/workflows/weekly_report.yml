name: Weekly Report

on:
  schedule:
    # 매주 월요일 오전 8시 KST (= 일요일 23:00 UTC)
    - cron: '0 23 * * 0'
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  send-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google credentials
        run: |
          mkdir -p credentials
          printf '%s' "${{ secrets.GOOGLE_CREDENTIALS_BASE64 }}" | base64 -d > credentials/credentials.json
          printf '%s' "${{ secrets.GOOGLE_TOKEN_BASE64 }}" | base64 -d > credentials/token.pickle

      - name: Run weekly report
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          REPORT_TIMEZONE: Asia/Seoul
        run: python main.py
